# RatScan — known remote-access software catalogue
#
# Identification data only. Nothing here is a verdict: presence of a tool is a fact,
# and whether it is wanted is the user's call. The `abuse` field records how often a
# product turns up in intrusions and support scams relative to legitimate use — it
# raises attention, it does not convict.
#
# `capabilities` drives the plain-language explanation the user actually reads, so it
# is written in terms of what someone can do to them, not feature names.
#
# Matching is deliberately conservative: a process name alone is weak evidence (any
# file can be renamed), so a match reports which signals agreed and the detector
# scores accordingly.

version: 1
updated: 2026-07-31

tools:
  # ---------------------------------------------------------------- remote desktop
  - id: tightvnc
    name: TightVNC
    vendor: GlavSoft
    category: remote-desktop
    abuse: medium
    capabilities: [screen-view, input-control, file-transfer, unattended]
    processes: [tvnserver.exe, tvnviewer.exe]
    services: [tvnserver]
    # Substring match: shipped builds have been signed as both "OOO GlavSoft" and
    # "GlavSoft LLC" over the years.
    signers: ["GlavSoft"]
    ports: [5800, 5900]

